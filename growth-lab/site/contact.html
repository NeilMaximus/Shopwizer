<main id="main" class="contact">
  <div class="wrap contact-grid">
    <div class="contact-intro">
      <h1>Where could your business perform better?</h1>
      <p class="lead">Make your martech, customer data and AI work harder for your business.</p>
      <dl class="contact-details">
        <div>
          <dt>Email</dt>
          <dd><a href="mailto:hello@growthlab.co.za">hello@growthlab.co.za</a></dd>
        </div>
        <!-- contact-phone:start -->
        <div>
          <dt>Phone</dt>
          <dd><a href="tel:+27845040505">+27 84 504 0505</a></dd>
        </div>
        <!-- contact-phone:end -->
      </dl>
    </div>

    <div class="contact-panel">
      <p class="form-notice" id="form-notice" role="status" hidden></p>
      <noscript><p class="form-notice">This form needs JavaScript. Please email hello@growthlab.co.za.</p></noscript>
      <form id="contact-form" method="post" novalidate data-mode="live" aria-label="Contact Growth Lab">
        <div class="fields">
          <div class="field">
            <label for="f-name">Full name</label>
            <input id="f-name" name="name" type="text" autocomplete="name" required maxlength="120" aria-describedby="f-name-error">
            <p class="field-error" id="f-name-error" hidden></p>
          </div>
          <div class="field">
            <label for="f-company">Company</label>
            <input id="f-company" name="company" type="text" autocomplete="organization" required maxlength="160" aria-describedby="f-company-error">
            <p class="field-error" id="f-company-error" hidden></p>
          </div>
          <div class="field">
            <label for="f-email">Work email</label>
            <input id="f-email" name="email" type="email" autocomplete="email" required maxlength="254" aria-describedby="f-email-error" inputmode="email" spellcheck="false">
            <p class="field-error" id="f-email-error" hidden></p>
          </div>
          <div class="field">
            <label for="f-phone">Contact number <span class="optional">(optional)</span></label>
            <input id="f-phone" name="phone" type="tel" autocomplete="tel" maxlength="40" aria-describedby="f-phone-error" inputmode="tel">
            <p class="field-error" id="f-phone-error" hidden></p>
          </div>
          <div class="field field-full">
            <label for="f-message">Message</label>
            <textarea id="f-message" name="message" rows="5" required maxlength="5000" aria-describedby="f-message-error" placeholder="Can you tell us more about your requirements?"></textarea>
            <p class="field-error" id="f-message-error" hidden></p>
          </div>
        </div>
        <div class="hp" aria-hidden="true">
          <label for="f-website">Leave this field empty</label>
          <input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <div class="captcha">
          <div class="recaptcha-slot" id="recaptcha"></div>
          <p class="field-error" id="recaptcha-error" hidden></p>
        </div>
        <div class="form-actions">
          <button class="btn btn-coral" type="submit">Let’s Talk</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </div>
  </div>
</main>
